name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Diagnose Snyk API access
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
          SNYK_API: https://api.eu.snyk.io
        run: |
          set +e
          for resource in projects issues; do
            response_file="$(mktemp)"
            http_code="$(curl -sS -o "$response_file" -w '%{http_code}' \
              -H "Authorization: token ${SNYK_TOKEN}" \
              -H 'Accept: application/vnd.api+json' \
              "${SNYK_API}/rest/orgs/${SNYK_ORG_ID}/${resource}?version=2024-10-15&limit=1")"
            echo "Snyk ${resource} endpoint HTTP ${http_code}"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps({"errors": d.get("errors"), "items": len(d.get("data", []))}, default=str))' "$response_file" 2>/dev/null || head -c 500 "$response_file"
            rm -f "$response_file"
          done

      - name: Restore dashboard history
        run: |
          mkdir -p public
          curl -fsSL "https://blb-infios.github.io/mobile-squad-dashboard/history.json" -o public/history.json || echo '{"snapshots":[]}' > public/history.json

      - name: Fetch Azure DevOps data
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG: Highjumpvso
          ADO_PROJECT: WES
          SKIP_SNYK: true
          SKIP_COVERAGE: true
        run: npm run aggregate

      - name: Fetch code coverage data
        continue-on-error: true
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_ORG: Highjumpvso
          ADO_PROJECT: WES
        run: npm run aggregate:coverage

      - name: Fetch Snyk data
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
          SNYK_ORG_ID: ${{ secrets.SNYK_ORG_ID }}
          SNYK_API: https://api.eu.snyk.io
        run: npm run aggregate:snyk

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
